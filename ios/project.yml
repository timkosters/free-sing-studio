name: Singwell
options:
  bundleIdPrefix: live.singwell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set this to your Apple Developer Team ID once enrolled (App Store Connect → Membership).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  SingwellCore:
    path: Packages/SingwellCore
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.20.0
targets:
  Singwell:
    type: application
    platform: iOS
    sources:
      - path: Singwell
        excludes:
          - "**/*.md"
          - "**/OFL-*.txt"
    dependencies:
      - package: SingwellCore
      - package: Supabase
        product: Supabase
    entitlements:
      path: Singwell/Resources/Singwell.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Singwell/Resources/Info.plist
      properties:
        CFBundleDisplayName: Singwell
        CFBundleName: Singwell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Singwell listens to your voice to show the note you are singing and to record your takes. Audio stays on your device.
        NSUserNotificationsUsageDescription: Singwell can remind you to practice at a time you choose.
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Fraunces-Light.ttf
          - Fraunces-Regular.ttf
          - Fraunces-Medium.ttf
          - Sora-Regular.ttf
          - Sora-Medium.ttf
          - Sora-SemiBold.ttf
        CFBundleURLTypes:
          - CFBundleURLName: live.singwell.app
            CFBundleURLSchemes: [singwell]
        # Shared backend with the web app (same Supabase project, same tables, same accounts).
        SupabaseURL: https://acfhkglxhnpvxcinmgss.supabase.co
        SupabaseAnonKey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZmhrZ2x4aG5wdnhjaW5tZ3NzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTY0NzMsImV4cCI6MjEwNTE3MjQ3M30.RKtEWQ4KpMO5fygNvl0FEKcdp4q6eqrarpkhIXK9zJk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.singwell.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    preBuildScripts: []
  SingwellTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SingwellTests]
    dependencies:
      - target: Singwell
      - package: SingwellCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.singwell.app.tests
schemes:
  Singwell:
    build:
      targets:
        Singwell: all
        SingwellTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Singwell/Resources/Products.storekit
    test:
      config: Debug
      targets: [SingwellTests]
      gatherCoverageData: true
    archive:
      config: Release
